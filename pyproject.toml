[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bip39lab"
version = "0.16.80"
description = "Offline BIP-39 / derivation lab (no network, no secret retention)"
requires-python = ">=3.11"
dependencies = [
  "shamir-mnemonic>=0.3.0",
]

[project.scripts]
bip39lab = "bip39lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bip39lab = ["data/english.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
