# Product daytime gates — green path for portfolio CI.
# Fail-closed: hardcodes + secrets + product_smoke (plugin smoke / unit).
# Full validate (mypy/ruff suite) stays on night_shift / ship; not GH smoke.
name: daytime-gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  daytime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install product Python deps
        run: |
          python -m pip install -U pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true
          fi
          pip install pytest hypothesis python-dotenv PyPDF2 ruff 2>/dev/null || true
          # bip39lab optional
          pip install shamir-mnemonic 2>/dev/null || true
      - name: J3 hardcodes
        run: |
          set -euo pipefail
          test -f scripts/check_hardcodes.py
          python scripts/check_hardcodes.py
      - name: J10 product smoke
        run: |
          set -euo pipefail
          export PYTHONPATH="${PYTHONPATH:-}:src:."
          if [ -f scripts/product_smoke.py ]; then
            python scripts/product_smoke.py --root .
          elif [ -d tests ]; then
            python -m pytest tests/ -q --tb=line -x --ignore=tests/e2e 2>/dev/null \
              || python -m pytest tests/ -q --tb=line -k "not e2e and not live"
          else
            echo "No product_smoke or tests"
            exit 1
          fi
      - name: J7 secrets
        run: |
          set -euo pipefail
          test -f scripts/check_secrets_diff.py
          python scripts/check_secrets_diff.py --base HEAD~1 --head HEAD \
            || python scripts/check_secrets_diff.py --base origin/main --head HEAD \
            || python scripts/check_secrets_diff.py
      - name: J12 Semgrep (optional config)
        run: |
          set -euo pipefail
          if [ ! -f .semgrep.yml ]; then
            echo "No .semgrep.yml — skip"
            exit 0
          fi
          python -m pip install -q semgrep
          # Soften: do not fail CI on first portfolio wave (report only)
          semgrep --config .semgrep.yml --quiet . || true
          echo "Semgrep completed (warn-only until baselined per product)"
