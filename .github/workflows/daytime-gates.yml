# Product daytime gates — aligned with daytime_readiness_subset (J3–J5 + smoke).
# Fail-closed on harness scripts; product deps installed from requirements*.
name: daytime-gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  daytime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install product Python deps
        run: |
          python -m pip install -U pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true; fi
          pip install pytest ruff hypothesis || true
          # common optional deps for portfolio products
          pip install python-dotenv PyPDF2 2>/dev/null || true
      - name: J5 daytime readiness (preferred full bar)
        run: |
          set -euo pipefail
          export PYTHONPATH="${PYTHONPATH:-}:src:."
          if [ -f scripts/daytime_readiness_subset.py ]; then
            python scripts/daytime_readiness_subset.py --root .
          elif [ -f scripts/product_smoke.py ]; then
            python scripts/product_smoke.py --root .
          else
            echo "No daytime_readiness_subset or product_smoke"
            exit 1
          fi
      - name: J3 hardcodes (explicit)
        run: |
          set -euo pipefail
          test -f scripts/check_hardcodes.py
          python scripts/check_hardcodes.py
      - name: J7 secrets
        run: |
          set -euo pipefail
          test -f scripts/check_secrets_diff.py
          python scripts/check_secrets_diff.py --base HEAD~1 --head HEAD \
            || python scripts/check_secrets_diff.py --base origin/main --head HEAD \
            || python scripts/check_secrets_diff.py
      - name: J12 Semgrep (if config present)
        run: |
          set -euo pipefail
          if [ ! -f .semgrep.yml ]; then
            echo "No .semgrep.yml — skip J12"
            exit 0
          fi
          python -m pip install -q semgrep
          # error severity only; allow warnings
          semgrep --config .semgrep.yml --error --quiet . || {
            echo "Semgrep findings — see above"
            exit 1
          }
