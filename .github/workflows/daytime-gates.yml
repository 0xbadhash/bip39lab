# Product daytime gates — J1–J5 + J7 (+ J11/J12 when applicable).
# Copied to .github/workflows/daytime-gates.yml by install_into_product.sh
# Fail-closed when harness scripts are present.
name: daytime-gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  daytime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dev deps
        run: |
          python -m pip install -U pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest ruff mypy || true
      - name: J1 unit tests
        run: |
          set -euo pipefail
          if [ -d tests ]; then
            python -m pytest tests/ -q
          else
            echo "No tests/ — skip J1"
          fi
      - name: J2 lint (ruff when configured)
        run: |
          set -euo pipefail
          if [ -f ruff.toml ] || [ -f .ruff.toml ] || [ -f pyproject.toml ]; then
            python -m ruff check scripts tests 2>/dev/null || python -m ruff check .
          else
            echo "No ruff config — soft ruff on scripts if present"
            if [ -d scripts ]; then python -m ruff check scripts || true; fi
          fi
      - name: J3 hardcodes
        run: |
          set -euo pipefail
          test -f scripts/check_hardcodes.py
          python scripts/check_hardcodes.py
      - name: J4 validate full
        run: |
          set -euo pipefail
          if [ -f scripts/validate.py ]; then
            python scripts/validate.py full --skip-vault-schema 2>/dev/null \
              || python scripts/validate.py full
          else
            echo "No validate.py — fail (harness incomplete)"
            exit 1
          fi
      - name: J5 daytime readiness
        run: |
          set -euo pipefail
          if [ -f scripts/daytime_readiness_subset.py ]; then
            python scripts/daytime_readiness_subset.py --root .
          elif [ -f scripts/product_smoke.py ]; then
            python scripts/product_smoke.py --root .
          else
            echo "No daytime_readiness_subset or product_smoke"
            exit 1
          fi
      - name: J7 secrets
        run: |
          set -euo pipefail
          test -f scripts/check_secrets_diff.py
          python scripts/check_secrets_diff.py --base HEAD~1 --head HEAD \
            || python scripts/check_secrets_diff.py --base origin/main --head HEAD \
            || python scripts/check_secrets_diff.py
      - name: J11 lockfile audit
        run: |
          if [ -f scripts/check_lockfile_audit.py ]; then
            python scripts/check_lockfile_audit.py --base HEAD~1 --head HEAD
          fi
      - name: J12 Semgrep
        run: |
          set -euo pipefail
          python -m pip install -q semgrep
          if [ -f .semgrep.yml ]; then
            semgrep --config .semgrep.yml --error --quiet .
          else
            semgrep --config p/python --config p/security-audit --error --quiet . \
              || semgrep --config auto --error --quiet .
          fi
