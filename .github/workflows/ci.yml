name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff mypy

      - name: Ruff
        run: python -m ruff check src tests legacy

      - name: Mypy (product package)
        run: python -m mypy src/bip39lab --ignore-missing-imports

      - name: Pytest
        run: python -m pytest -q
        env:
          PYTHONPATH: src

      - name: Hardcode scan
        run: python scripts/check_hardcodes.py

      - name: Product smoke
        run: python scripts/product_smoke.py --root .

  web-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Web abandon vectors (Node)
        run: python -m pytest -q tests/test_web_vectors.py
        env:
          PYTHONPATH: src
