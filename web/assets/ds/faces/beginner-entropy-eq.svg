<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-labelledby="t d">
  <title id="t">Key plus dice equals stronger seed</title>
  <desc id="d">Something you know plus randomness (entropy) makes a stronger seed</desc>
  <g fill="none" stroke="#e8b84a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- key -->
    <circle cx="48" cy="38" r="16"/>
    <circle cx="48" cy="38" r="6"/>
    <path d="M62 42 h38 v8 h-8 v8 h-8 v-8 h-8"/>
    <!-- dice -->
    <rect x="168" y="18" width="52" height="52" rx="8"/>
    <circle cx="182" cy="32" r="3.5" fill="#e8b84a" stroke="none"/>
    <circle cx="194" cy="44" r="3.5" fill="#e8b84a" stroke="none"/>
    <circle cx="206" cy="56" r="3.5" fill="#e8b84a" stroke="none"/>
    <circle cx="182" cy="56" r="3.5" fill="#e8b84a" stroke="none"/>
    <circle cx="206" cy="32" r="3.5" fill="#e8b84a" stroke="none"/>
    <!-- lock -->
    <rect x="318" y="36" width="48" height="36" rx="6"/>
    <path d="M328 36 v-10 a14 14 0 0 1 28 0 v10"/>
    <circle cx="342" cy="54" r="5"/>
  </g>
  <text x="118" y="48" fill="#e8b84a" font-size="28" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">+</text>
  <text x="248" y="48" fill="#e8b84a" font-size="28" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">=</text>
  <text x="48" y="108" text-anchor="middle" fill="#c8c4bc" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">Something you know</text>
  <text x="194" y="108" text-anchor="middle" fill="#c8c4bc" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">Randomness (entropy)</text>
  <text x="342" y="108" text-anchor="middle" fill="#c8c4bc" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">Stronger seed</text>
</svg>
