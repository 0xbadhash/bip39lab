<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 96" fill="none" role="img" aria-label="Beginner key plus lock to 128-bit seed">
  <defs>
    <marker id="cx-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L8 4 L0 7" stroke="currentColor" stroke-width="1" fill="none"/>
    </marker>
  </defs>
  <!-- key = circle + rect (kit circle r=16 scaled via group) -->
  <g transform="translate(0,0)">
    <circle cx="24" cy="24" r="16" stroke="currentColor" stroke-width="1"/>
    <rect x="36" y="20" width="28" height="8" rx="4" stroke="currentColor" stroke-width="1"/>
    <rect x="56" y="28" width="4" height="8" rx="2" stroke="currentColor" stroke-width="1"/>
  </g>
  <!-- arrow-straight.svg path (rotate in use; here identity) -->
  <g transform="translate(48,0) scale(0.5,1)">
    <path d="M8 24 H88" stroke="currentColor" stroke-width="1" marker-end="url(#cx-ah)"/>
  </g>
  <!-- lock = semicircle.svg upper-arc + rect body -->
  <g transform="translate(96,-12)">
    <path d="M24 36 A24 24 0 0 1 72 36" stroke="currentColor" stroke-width="1"/>
    <rect x="28" y="36" width="40" height="20" rx="8" stroke="currentColor" stroke-width="1"/>
  </g>
  <!-- too-few-dice vs 128 bits: rect bars -->
  <g transform="translate(8,64)">
    <rect x="0" y="8" width="40" height="12" rx="6" stroke="currentColor" stroke-width="1"/>
    <rect x="48" y="4" width="128" height="16" rx="8" stroke="currentColor" stroke-width="1"/>
    <text x="112" y="16" fill="currentColor" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle">128 bits</text>
  </g>
</svg>
