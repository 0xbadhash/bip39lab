<!DOCTYPE html>
<html lang="en" data-paint="starter" data-teach="on" data-tab="lab">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MOCK ALL TABS</title>
<style>
:root{--bg:#0b0f14;--el:#121821;--panel:#161d27;--p2:#1a2330;--bd:#243044;--tx:#e8eef7;--mu:#8b9bb4;--ac:#3d8bfd;--ok:#3ecf8e;--wn:#e6b84d;--bdg:#e85d5d;--r:12px;--rs:8px;--f:Segoe UI,system-ui,sans-serif;--m:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:14px}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.sidebar{background:var(--el);border-right:1px solid var(--bd);padding:1rem .7rem;display:flex;flex-direction:column;gap:.28rem}
.brand{font-weight:700;padding:.2rem .5rem .7rem}.brand span{color:var(--ac)}
.nav-item{display:block;padding:.42rem .55rem;border-radius:var(--rs);color:var(--mu);border:0;background:0;width:100%;text-align:left;font:inherit;cursor:pointer}.nav-item.active,.nav-item:hover{background:var(--panel);color:var(--tx)}.nav-item.active{border-left:3px solid var(--ac)}
.nav-item small{display:block;font-size:.68rem;color:var(--mu)}.main{padding:1rem 1.15rem 2rem;max-width:960px}
.warn{background:rgba(230,184,77,.1);border:1px solid rgba(230,184,77,.35);color:#f0d78a;border-radius:var(--rs);padding:.6rem .75rem;margin:0 0 .85rem;font-size:.8rem}
.row{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 .75rem;align-items:center}
.btn{border:1px solid var(--bd);background:var(--panel);color:var(--tx);border-radius:var(--rs);padding:.38rem .7rem;font:inherit;cursor:pointer}.btn.primary{background:var(--ac);border-color:var(--ac);color:#fff}.btn.secondary{background:transparent}.btn.danger{background:transparent;border-color:rgba(232,93,93,.65);color:var(--bdg)}.btn.active-lvl{border-color:var(--ac);color:var(--ac)}
.chip{display:inline-flex;border:1px solid var(--bd);border-radius:999px;padding:.12rem .5rem;font-size:.7rem;color:var(--mu)}.chip.ok{color:var(--ok)}.chip.warn{color:var(--wn)}
.card{background:var(--el);border:1px solid var(--bd);border-radius:var(--r);padding:.8rem .9rem;margin-bottom:.8rem}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}.card-head h2{margin:0;font-size:.95rem}.muted{color:var(--mu);font-size:.78rem}
.rail{display:flex;flex-wrap:wrap;gap:.28rem;margin-bottom:.75rem}.rail-step{border:1px solid var(--bd);border-radius:999px;padding:.16rem .5rem;font-size:.7rem;color:var(--mu)}.rail-step.done{color:var(--ok);border-color:rgba(62,207,142,.5)}.rail-step.current{border-color:var(--ac);color:var(--ac)}
.flow{border-left:3px solid var(--ac);padding:.45rem .7rem;background:rgba(61,139,253,.06);margin-bottom:.85rem;font-size:.8rem}.flow strong{color:var(--ac)}
.strip{margin:.4rem 0 .7rem;padding:.65rem .7rem;border:1px solid var(--bd);border-radius:var(--r);background:var(--bg)}.stages{display:flex;flex-wrap:wrap;gap:.32rem}.arrow{color:var(--mu);align-self:center}
.stage{flex:1 1 5.6rem;min-width:4.6rem;border:1px solid var(--bd);border-radius:var(--rs);padding:.4rem .45rem;opacity:.36}.stage .lb{display:block;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:700}.stage .dt{display:block;font-family:var(--m);font-size:.7rem;color:var(--mu);margin-top:.15rem;word-break:break-all}.stage .cap{display:block;margin-top:.25rem;font-size:.7rem;color:var(--mu)}html[data-teach=off] .cap{display:none!important}.stage.lit{opacity:1;background:var(--panel);border-color:var(--ac)}
.grid{list-style:none;margin:.35rem 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.24rem}.grid li{border:1px solid var(--bd);border-radius:6px;background:var(--p2);padding:.22rem .3rem;font-size:.74rem}.wi{display:block;font-size:.6rem;color:var(--mu);font-weight:700}.ww{font-family:var(--m)}.stamp{margin-top:.35rem;font-size:.7rem;color:var(--wn);border:1px dashed rgba(230,184,77,.4);border-radius:6px;padding:.25rem .4rem;display:inline-block}
.stills{display:none;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.45rem;margin:.55rem 0}.stills.on{display:grid}.stills figure{margin:0;border:1px solid var(--bd);border-radius:var(--rs);overflow:hidden;background:var(--panel)}.stills img{width:100%;height:110px;object-fit:cover;display:block}.stills figcaption{padding:.3rem .4rem;font-size:.7rem;color:var(--mu)}
.tab{display:none}.tab.on{display:block}.ks{display:none;margin-top:.5rem;gap:.4rem}.ks.on{display:grid}.ks.two{grid-template-columns:1fr 1fr}.box{border:1px solid var(--bd);border-radius:var(--rs);padding:.4rem .5rem;background:var(--panel);font-size:.76rem}.controls{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
</style></head><body>
<div class="app"><aside class="sidebar"><div class="brand">bip39<span>·lab</span></div>
<button type="button" class="nav-item active" data-tab="lab"><strong>Lab</strong><small>Generate and derive</small></button>
<button type="button" class="nav-item" data-tab="multisig"><strong>Multisig</strong><small>M-of-N explainer</small></button>
<button type="button" class="nav-item" data-tab="shamir"><strong>Shamir</strong><small>Shares (edu)</small></button>
<button type="button" class="nav-item" data-tab="network"><strong>Network</strong><small>Fees · address-only</small></button>
<button type="button" class="nav-item" data-tab="tools"><strong>Tools</strong><small>Path · QR · print</small></button>
<button type="button" class="nav-item" data-tab="glossary"><strong>Glossary</strong><small>Threat model</small></button>
<div style="flex:1"></div><span class="chip warn">MOCK · not live</span></aside>
<main class="main"><p class="warn"><strong>All-tabs mock.</strong> Same level paints every tab. Stills reuse Lab PNGs. zoo vector.</p>
<div class="flow" id="flow"></div><div class="rail" id="rail"></div>
<div class="row"><button type="button" class="btn secondary active-lvl" data-paint-set="starter">Starter</button><button type="button" class="btn secondary" data-paint-set="beginner">Beginner</button><button type="button" class="btn secondary" data-paint-set="intermediate">Intermediate</button><button type="button" class="btn secondary" data-paint-set="advanced">Advanced</button><button type="button" class="btn secondary" id="btnTeach">Extra help Off</button><span class="chip ok" id="chip">lab · starter</span></div>
<section class="tab on" id="tab-lab"><div class="card"><div class="card-head"><h2>Lab · BIP-39</h2><span class="chip warn">Not a wallet</span></div><div class="stills" id="labStills"></div><div class="strip"><div class="stages" id="labStages"></div><div class="ks two" id="labExtra"></div></div><div class="controls"><button type="button" class="btn primary" data-act="gen">Generate</button><button type="button" class="btn secondary" data-act="val">Validate</button><button type="button" class="btn danger" data-act="clr">Clear secrets</button></div></div></section>
<section class="tab" id="tab-multisig"><div class="card"><div class="card-head"><h2>Multisig · M-of-N</h2><span class="chip warn">Calculator only</span></div><div class="stills" id="msStills"></div><div class="strip"><div class="stages" id="msStages"></div><div class="ks two" id="msExtra"></div></div><div class="controls"><button type="button" class="btn primary" data-act="build">Build vault</button><button type="button" class="btn secondary" data-act="map">Vault map</button><button type="button" class="btn danger" data-act="clr">Clear keys</button></div></div></section>
<section class="tab" id="tab-shamir"><div class="card"><div class="card-head"><h2>Shamir · edu shares</h2><span class="chip warn">Not SLIP-39</span></div><div class="stills" id="shStills"></div><div class="strip"><div class="stages" id="shStages"></div><div class="ks two" id="shExtra"></div></div><div class="controls"><button type="button" class="btn primary" data-act="split">Split</button><button type="button" class="btn secondary" data-act="recomb">Recombine</button><button type="button" class="btn danger" data-act="clr">Clear shares</button></div></div></section>
<section class="tab" id="tab-network"><div class="card"><div class="card-head"><h2>Network</h2><span class="chip warn">Never sends seed</span></div><div class="strip"><div class="stages" id="nwStages"></div></div></div></section>
<section class="tab" id="tab-tools"><div class="card"><div class="card-head"><h2>Tools</h2><span class="chip">TEST DATA</span></div><div class="strip"><div class="stages" id="tlStages"></div></div></div></section>
<section class="tab" id="tab-glossary"><div class="card"><div class="card-head"><h2>Glossary</h2></div><p class="muted" id="glCopy"></p></div></section>
</main></div>
<script>
(function(){
var RAW="https://raw.githubusercontent.com/0xbadhash/bip39lab/feat/gradual-visual-teach/web/";
var lvl="starter",tab="lab",teach=true,rail=0;
var words="zoo zoo zoo zoo zoo zoo zoo zoo zoo zoo zoo wrong".split(" ");
var A="bc1qk0a9hr7wjfxeenz9nwenw9flhq0tmsf6vsgnn2";
var RAIL={lab:["1 Orient","2 Generate","3 Validate","4 Address","5 Backup","6 Hide","7 Clear","8 Next"],multisig:["1 Orient","2 Keys","3 Policy","4 Build","5 Map","6 Hide","7 Clear","8 Next"],shamir:["1 Orient","2 Secret","3 Split","4 Threshold","5 Recombine","6 Hide","7 Clear","8 Next"],network:["1 Orient","2 Leak-ack","3 Fees","4 Lookup","5 Hide","6 Next"],tools:["1 Source","2 Path","3 QR","4 Print","5 Hide","6 Next"],glossary:["1 Terms","2 Threat","3 Next"]};
var FLOW={lab:{starter:"<strong>Lab Starter:</strong> card only.",beginner:"<strong>Lab Beginner:</strong> ENT+CS+addr + key/dice/lock stills.",intermediate:"<strong>Lab Intermediate:</strong> PP + keys≠shares + jump stills.",advanced:"<strong>Lab Advanced:</strong> full strip + master-child still."},multisig:{starter:"<strong>MS Starter:</strong> keys only.",beginner:"<strong>MS Beginner:</strong> keys + M-of-N.",intermediate:"<strong>MS Intermediate:</strong> script + keys still reused.",advanced:"<strong>MS Advanced:</strong> address + vault map."},shamir:{starter:"<strong>SH Starter:</strong> secret only.",beginner:"<strong>SH Beginner:</strong> split N.",intermediate:"<strong>SH Intermediate:</strong> threshold + hex still.",advanced:"<strong>SH Advanced:</strong> recombine; SLIP-39 elsewhere."},network:{starter:"<strong>NW Starter:</strong> ghost address.",beginner:"<strong>NW Beginner:</strong> leak-ack.",intermediate:"<strong>NW Intermediate:</strong> fees.",advanced:"<strong>NW Advanced:</strong> address-only balance."},tools:{starter:"<strong>Tools Starter:</strong> TEST DATA.",beginner:"<strong>Tools Beginner:</strong> path.",intermediate:"<strong>Tools Intermediate:</strong> descriptors.",advanced:"<strong>Tools Advanced:</strong> QR+print."},glossary:{starter:"<strong>Gloss Starter:</strong> BIP-39 terms.",beginner:"<strong>Gloss Beginner:</strong> entropy/PP.",intermediate:"<strong>Gloss Intermediate:</strong> MS/Shamir.",advanced:"<strong>Gloss Advanced:</strong> xpub/threat."}};
function fig(s,c){return "<figure><img src='"+RAW+s+"' alt='"+c+"'><figcaption>"+c+"</figcaption></figure>";}
function stillsFor(){if(tab==="lab"){if(lvl==="beginner")return fig("assets/ds/faces/beginner-key.png","Know")+fig("assets/ds/faces/beginner-dice.png","Entropy")+fig("assets/ds/faces/beginner-lock.png","Seed");if(lvl==="intermediate")return fig("assets/ds/faces/intermediate-keys.png","Multisig → tab")+fig("assets/ds/faces/intermediate-hex-shares.png","Shamir → tab")+fig("assets/ds/faces/intermediate-share-words.png","SLIP-39");if(lvl==="advanced")return fig("assets/ds/faces/advanced-master-child.png","master → child");return fig("assets/ds/faces/starter-first-hour.png","First hour");}if(tab==="multisig"&&(lvl==="intermediate"||lvl==="advanced"))return fig("assets/ds/faces/intermediate-keys.png","What Multisig is");if(tab==="shamir"&&(lvl==="intermediate"||lvl==="advanced"))return fig("assets/ds/faces/intermediate-hex-shares.png","What Shamir is")+fig("assets/ds/faces/intermediate-share-words.png","SLIP-39 different");return "";}
function st(l,d,c,lit){return "<div class='stage"+(lit?" lit":"")+"'><span class='lb'>"+l+"</span><span class='dt'>"+d+"</span><span class='cap'>"+c+"</span></div>";}
function ar(){return "<span class='arrow'>→</span>";}
function wg(){return "<ol class='grid'>"+words.map(function(w,i){return "<li><span class='wi'>"+(i+1)+"</span><span class='ww'>"+w+"</span></li>";}).join("")+"</ol><span class='stamp'>Practice. Not a wallet.</span>";}
function paintLab(){var L=lvl;document.getElementById("labStages").innerHTML=st("entropy","128 bits","bits",L!=="starter")+ar()+st("checksum","4 bits","SHA-256",L!=="starter")+ar()+"<div class='stage lit'><span class='lb'>words</span>"+wg()+"<span class='cap'>card</span></div>"+ar()+st("seed","PBKDF2","+PP",L==="advanced")+ar()+st("address",L==="starter"?"—":A,"BIP84",L!=="starter");var ex=document.getElementById("labExtra");if(L==="intermediate"||L==="advanced"){ex.className="ks two on";ex.innerHTML="<div class='box'><strong>PP A/B</strong><div class='dt'>"+A+"</div></div><div class='box'><strong>Keys ≠ shares</strong></div>";}else{ex.className="ks";ex.innerHTML="";}}
function paintMs(){var L=lvl;document.getElementById("msStages").innerHTML=st("keys","3 pub","cosigners",true)+ar()+st("policy","2-of-3","M-of-N",L!=="starter")+ar()+st("script","P2WSH","BIP67",L==="intermediate"||L==="advanced")+ar()+st("address",L==="advanced"?"bc1q…vault":"—","joint",L==="advanced");var ex=document.getElementById("msExtra");if(L==="advanced"){ex.className="ks two on";ex.innerHTML="<div class='box'><strong>Vault map</strong></div><div class='box'><strong>zpub ≠ xpub</strong></div>";}else{ex.className="ks";ex.innerHTML="";}}
function paintSh(){var L=lvl;document.getElementById("shStages").innerHTML=st("secret","hex","not a seed",true)+ar()+st("N shares","N=3","cards",L!=="starter")+ar()+st("threshold","M=2","any 2",L==="intermediate"||L==="advanced")+ar()+st("recombine",L==="advanced"?"match":"—","verify",L==="advanced");var ex=document.getElementById("shExtra");if(L==="advanced"){ex.className="ks two on";ex.innerHTML="<div class='box'><strong>GF(256) edu</strong></div><div class='box'><strong>SLIP-39 elsewhere</strong></div>";}else{ex.className="ks";ex.innerHTML="";}}
function paintNw(){var L=lvl;document.getElementById("nwStages").innerHTML=st("address",L==="starter"?"ghost":A,"from Lab",L!=="starter")+ar()+st("leak-ack","opt-in","never seed",L!=="starter")+ar()+st("fees","sat/vB","bands",L==="intermediate"||L==="advanced")+ar()+st("balance",L==="advanced"?"unknown≠0":"—","fail-closed",L==="advanced");}
function paintTl(){var L=lvl;document.getElementById("tlStages").innerHTML=st("source","TEST DATA","not live",true)+ar()+st("path","m/84h","play",L!=="starter")+ar()+st("QR","offline","walls",L==="advanced")+ar()+st("print","card","accent",L==="advanced");}
function paintGl(){document.getElementById("glCopy").textContent={starter:"BIP-39, mnemonic, address.",beginner:"+ entropy, passphrase.",intermediate:"+ multisig, Shamir, SLIP-39.",advanced:"+ xpub, threat, air-gap."}[lvl];}
function paintRail(){var s=RAIL[tab];document.getElementById("rail").innerHTML=s.map(function(x,i){return "<span class='rail-step"+(i<rail?" done":i===rail?" current":"")+"'>"+x+"</span>";}).join("");}
function paintStills(){["labStills","msStills","shStills"].forEach(function(id){var el=document.getElementById(id);if(!el)return;var html=(id==="labStills"||(id==="msStills"&&tab==="multisig")||(id==="shStills"&&tab==="shamir"))?stillsFor():"";el.innerHTML=html;el.className="stills"+(html?" on":"");});}
function render(){document.documentElement.setAttribute("data-paint",lvl);document.getElementById("chip").textContent=tab+" · "+lvl;document.getElementById("flow").innerHTML=FLOW[tab][lvl];document.querySelectorAll("[data-paint-set]").forEach(function(b){b.classList.toggle("active-lvl",b.getAttribute("data-paint-set")===lvl);});document.querySelectorAll("[data-tab]").forEach(function(b){b.classList.toggle("active",b.getAttribute("data-tab")===tab);});document.querySelectorAll(".tab").forEach(function(s){s.classList.toggle("on",s.id==="tab-"+tab);});paintLab();paintMs();paintSh();paintNw();paintTl();paintGl();paintStills();paintRail();}
document.querySelectorAll("[data-paint-set]").forEach(function(b){b.addEventListener("click",function(){lvl=b.getAttribute("data-paint-set");if(lvl!=="starter")rail=Math.max(rail,RAIL[tab].length-1);render();});});
document.querySelectorAll("[data-tab]").forEach(function(b){b.addEventListener("click",function(){tab=b.getAttribute("data-tab");rail=0;render();});});
document.getElementById("btnTeach").addEventListener("click",function(){teach=!teach;document.documentElement.setAttribute("data-teach",teach?"on":"off");this.textContent=teach?"Extra help Off":"Extra help On";if(!teach)rail=Math.max(rail,5);render();});
document.addEventListener("click",function(e){var a=e.target.getAttribute&&e.target.getAttribute("data-act");if(!a)return;if(a==="gen"||a==="build"||a==="split")rail=Math.max(rail,1);if(a==="val"||a==="map"||a==="recomb")rail=Math.max(rail,4);if(a==="clr")rail=Math.max(rail,6);render();});
render();
})();
</script></body></html>
