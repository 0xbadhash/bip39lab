<svg viewBox="0 0 220 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A phone app keeps keys next to the internet">
  <title>Hot phone</title>
  <rect x="50" y="12" width="120" height="50" rx="8" fill="#1a2330" stroke="#e85d5d" stroke-width="1.5"/>
  <text x="110" y="34" text-anchor="middle" fill="#e8eef7" font-size="10" font-family="system-ui,sans-serif">phone app</text>
  <text x="110" y="50" text-anchor="middle" fill="#e85d5d" font-size="9" font-family="system-ui,sans-serif">keys near the net</text>
  <text x="110" y="78" text-anchor="middle" fill="#8b9bb4" font-size="8" font-family="system-ui,sans-serif">software can be hot</text>
</svg>
