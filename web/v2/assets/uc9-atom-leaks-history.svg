<svg viewBox="0 0 220 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Publishing an xpub leaks future addresses">
  <title>Privacy leak</title>
  <rect x="20" y="14" width="80" height="44" rx="8" fill="#1a2330" stroke="#3d8bfd"/>
  <text x="60" y="40" text-anchor="middle" fill="#e8eef7" font-size="9" font-family="ui-monospace,Menlo,Consolas,monospace">xpub</text>
  <path d="M104 36h20" stroke="#e85d5d" stroke-width="1.5"/>
  <rect x="128" y="14" width="72" height="44" rx="8" fill="#1a2330" stroke="#e85d5d"/>
  <text x="164" y="34" text-anchor="middle" fill="#e8eef7" font-size="8" font-family="system-ui,sans-serif">future</text>
  <text x="164" y="48" text-anchor="middle" fill="#e85d5d" font-size="8" font-family="system-ui,sans-serif">history</text>
  <text x="110" y="78" text-anchor="middle" fill="#8b9bb4" font-size="8" font-family="system-ui,sans-serif">do not publish casually</text>
</svg>
