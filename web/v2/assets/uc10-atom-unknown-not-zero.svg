<svg viewBox="0 0 220 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A failed lookup is unknown not zero">
  <title>Unknown is not zero</title>
  <rect x="20" y="14" width="80" height="46" rx="8" fill="#1a2330" stroke="#e85d5d"/>
  <text x="60" y="42" text-anchor="middle" fill="#e85d5d" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace">0.00</text>
  <text x="110" y="42" text-anchor="middle" fill="#e85d5d" font-size="14" font-weight="700" font-family="system-ui,sans-serif">≠</text>
  <rect x="120" y="14" width="80" height="46" rx="8" fill="#1a2330" stroke="#3d8bfd"/>
  <text x="160" y="42" text-anchor="middle" fill="#e8eef7" font-size="11" font-family="system-ui,sans-serif">unknown</text>
  <text x="110" y="78" text-anchor="middle" fill="#8b9bb4" font-size="8" font-family="system-ui,sans-serif">failed lookup is not an empty wallet</text>
</svg>
