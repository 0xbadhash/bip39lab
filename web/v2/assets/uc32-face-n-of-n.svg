<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Every part is required, not any two of three">
  <title>Need every part</title>
  <rect width="640" height="640" rx="48" fill="#1a2330"/>
  <rect x="70" y="56" width="150" height="200" rx="16" fill="#121820" stroke="#e8a23c" stroke-width="7"/>
  <text x="145" y="150" text-anchor="middle" fill="#e8eef7" font-size="22" font-family="system-ui,sans-serif">part 1</text>
  <rect x="245" y="56" width="150" height="200" rx="16" fill="#121820" stroke="#e8a23c" stroke-width="7"/>
  <text x="320" y="150" text-anchor="middle" fill="#e8eef7" font-size="22" font-family="system-ui,sans-serif">part 2</text>
  <rect x="420" y="56" width="150" height="200" rx="16" fill="#2a1414" stroke="#e85d5d" stroke-width="7" stroke-dasharray="12 8"/>
  <text x="495" y="140" text-anchor="middle" fill="#e85d5d" font-size="20" font-family="system-ui,sans-serif">missing</text>
  <text x="495" y="176" text-anchor="middle" fill="#e85d5d" font-size="28" font-family="system-ui,sans-serif">✗</text>
  <path d="M145 268v40M320 268v40M495 268v40" stroke="#8b9bb4" stroke-width="6"/>
  <rect x="120" y="318" width="400" height="88" rx="18" fill="#2a1414" stroke="#e85d5d" stroke-width="6"/>
  <text x="320" y="372" text-anchor="middle" fill="#e85d5d" font-size="26" font-family="system-ui,sans-serif">cannot rebuild</text>
  <text x="320" y="470" text-anchor="middle" fill="#e8eef7" font-size="26" font-family="system-ui,sans-serif">need every part</text>
  <text x="320" y="520" text-anchor="middle" fill="#8b9bb4" font-size="20" font-family="system-ui,sans-serif">not any 2 of 3</text>
  <text x="320" y="568" text-anchor="middle" fill="#8b9bb4" font-size="18" font-family="system-ui,sans-serif">N-of-N, not Shamir</text>
</svg>
