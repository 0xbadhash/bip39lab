  <circle cx="320" cy="250" r="140" fill="#121820" stroke="#e8a23c" stroke-width="12"/>
  <circle cx="320" cy="250" r="12" fill="#e8a23c"/>
  <path d="M320 250v-88" stroke="#e8eef7" stroke-width="10" stroke-linecap="round"/>
  <path d="M320 250l52 28" stroke="#3d8bfd" stroke-width="8" stroke-linecap="round"/>
  <rect x="72" y="430" width="200" height="120" rx="20" fill="#121820" stroke="#3ecf8e" stroke-width="7"/>
  <text x="172" y="482" text-anchor="middle" fill="#3ecf8e" font-size="24" font-family="system-ui,sans-serif">owner</text>
