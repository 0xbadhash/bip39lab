<svg viewBox="0 0 220 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="You hold the recovery words">
  <title>You hold</title>
  <rect x="40" y="12" width="140" height="50" rx="8" fill="#1a2330" stroke="#3ecf8e" stroke-width="1.5"/>
  <text x="110" y="34" text-anchor="middle" fill="#e8eef7" font-size="10" font-family="system-ui,sans-serif">your words</text>
  <text x="110" y="50" text-anchor="middle" fill="#3ecf8e" font-size="9" font-family="system-ui,sans-serif">you can spend</text>
  <text x="110" y="78" text-anchor="middle" fill="#8b9bb4" font-size="8" font-family="system-ui,sans-serif">you can also lose them</text>
</svg>
