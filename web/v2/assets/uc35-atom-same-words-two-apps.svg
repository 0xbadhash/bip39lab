<svg viewBox="0 0 220 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The same twelve English words open different wallets in BIP-39 vs Electrum">
  <title>Same words, two apps, two wallets</title>
  <rect x="8" y="10" width="204" height="22" rx="5" fill="#1a2330" stroke="#243044"/>
  <text x="110" y="25" text-anchor="middle" fill="#e8eef7" font-size="10" font-family="system-ui,sans-serif">same 12 English words</text>
  <rect x="8" y="42" width="88" height="36" rx="6" fill="#1a2330" stroke="#3d8bfd"/>
  <text x="52" y="57" text-anchor="middle" fill="#8eb6ff" font-size="8" font-family="system-ui,sans-serif">BIP-39 app</text>
  <text x="52" y="71" text-anchor="middle" fill="#e8eef7" font-size="8" font-family="system-ui,sans-serif">wallet A</text>
  <text x="110" y="66" text-anchor="middle" fill="#e85d5d" font-size="16" font-weight="700" font-family="system-ui,sans-serif">≠</text>
  <rect x="124" y="42" width="88" height="36" rx="6" fill="#1a2330" stroke="#c9a227"/>
  <text x="168" y="57" text-anchor="middle" fill="#e6c86a" font-size="8" font-family="system-ui,sans-serif">Electrum app</text>
  <text x="168" y="71" text-anchor="middle" fill="#e8eef7" font-size="8" font-family="system-ui,sans-serif">wallet B</text>
</svg>
