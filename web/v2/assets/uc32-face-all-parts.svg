<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hide one part fails; all parts rebuild">
  <title>All parts</title>
  <rect width="640" height="640" rx="48" fill="#1a2330"/>
  <rect x="80" y="48" width="200" height="160" rx="16" fill="#121820" stroke="#3ecf8e" stroke-width="7"/>
  <text x="180" y="140" text-anchor="middle" fill="#e8eef7" font-size="22" font-family="system-ui,sans-serif">part 1</text>
  <rect x="360" y="48" width="200" height="160" rx="16" fill="#121820" stroke="#3ecf8e" stroke-width="7"/>
  <text x="460" y="140" text-anchor="middle" fill="#e8eef7" font-size="22" font-family="system-ui,sans-serif">part 2</text>
  <path d="M180 220v48M460 220v48" stroke="#3ecf8e" stroke-width="8" stroke-linecap="round"/>
  <rect x="140" y="278" width="360" height="88" rx="18" fill="#102018" stroke="#3ecf8e" stroke-width="7"/>
  <text x="320" y="332" text-anchor="middle" fill="#3ecf8e" font-size="24" font-family="system-ui,sans-serif">same 12 words</text>
  <rect x="100" y="400" width="440" height="80" rx="16" fill="#2a1414" stroke="#e85d5d" stroke-width="6"/>
  <text x="320" y="450" text-anchor="middle" fill="#e85d5d" font-size="22" font-family="system-ui,sans-serif">hide one → fail</text>
  <text x="320" y="530" text-anchor="middle" fill="#e8eef7" font-size="22" font-family="system-ui,sans-serif">all parts required</text>
  <text x="320" y="578" text-anchor="middle" fill="#8b9bb4" font-size="18" font-family="system-ui,sans-serif">N-of-N, not any 2 of 3</text>
</svg>
