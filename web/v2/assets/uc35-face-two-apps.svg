<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Same twelve English words open two different wallets">
  <title>Same words, two apps</title>
  <rect width="640" height="640" rx="48" fill="#1a2330"/>
  <rect x="100" y="48" width="440" height="120" rx="24" fill="#121820" stroke="#8b9bb4" stroke-width="7"/>
  <text x="320" y="98" text-anchor="middle" fill="#e8eef7" font-size="26" font-family="system-ui,sans-serif">same 12 English words</text>
  <text x="320" y="136" text-anchor="middle" fill="#8b9bb4" font-size="18" font-family="ui-monospace,Menlo,sans-serif">abandon · ability · · ·</text>
  <path d="M200 176v40M440 176v40" stroke="#8b9bb4" stroke-width="6" stroke-linecap="round"/>
  <rect x="48" y="220" width="248" height="260" rx="24" fill="#121820" stroke="#3d8bfd" stroke-width="8"/>
  <text x="172" y="280" text-anchor="middle" fill="#8ec5ff" font-size="22" font-family="system-ui,sans-serif">BIP-39 app</text>
  <rect x="88" y="308" width="168" height="88" rx="16" fill="#102028"/>
  <text x="172" y="348" text-anchor="middle" fill="#e8eef7" font-size="20" font-family="ui-monospace,Menlo,sans-serif">tb1q…</text>
  <text x="172" y="380" text-anchor="middle" fill="#8b9bb4" font-size="16" font-family="system-ui,sans-serif">wallet A</text>
  <text x="172" y="444" text-anchor="middle" fill="#3d8bfd" font-size="18" font-family="system-ui,sans-serif">Trezor · Ledger</text>
  <rect x="344" y="220" width="248" height="260" rx="24" fill="#121820" stroke="#e8a23c" stroke-width="8"/>
  <text x="468" y="280" text-anchor="middle" fill="#e8a23c" font-size="22" font-family="system-ui,sans-serif">Electrum app</text>
  <rect x="384" y="308" width="168" height="88" rx="16" fill="#2a1810"/>
  <text x="468" y="348" text-anchor="middle" fill="#e8eef7" font-size="20" font-family="ui-monospace,Menlo,sans-serif">different</text>
  <text x="468" y="380" text-anchor="middle" fill="#8b9bb4" font-size="16" font-family="system-ui,sans-serif">wallet B</text>
  <text x="468" y="444" text-anchor="middle" fill="#e8a23c" font-size="18" font-family="system-ui,sans-serif">other recipe</text>
  <circle cx="320" cy="350" r="36" fill="#1a2330" stroke="#e85d5d" stroke-width="6"/>
  <text x="320" y="362" text-anchor="middle" fill="#e85d5d" font-size="32" font-family="system-ui,sans-serif" font-weight="700">≠</text>
  <text x="320" y="560" text-anchor="middle" fill="#e8eef7" font-size="24" font-family="system-ui,sans-serif">same words, two wallets</text>
  <text x="320" y="598" text-anchor="middle" fill="#8b9bb4" font-size="18" font-family="system-ui,sans-serif">the tb1 is not Electrum coins</text>
</svg>
