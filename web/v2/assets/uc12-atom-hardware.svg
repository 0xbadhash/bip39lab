<svg viewBox="0 0 220 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A hardware signer keeps keys on a dedicated device">
  <title>Hardware signer</title>
  <rect x="55" y="14" width="110" height="28" rx="6" fill="#1a2330" stroke="#3ecf8e" stroke-width="1.5"/>
  <text x="110" y="32" text-anchor="middle" fill="#e8eef7" font-size="9" font-family="system-ui,sans-serif">signer</text>
  <path d="M110 42v8" stroke="#243044" stroke-width="1.5"/>
  <text x="110" y="64" text-anchor="middle" fill="#8b9bb4" font-size="8" font-family="system-ui,sans-serif">keys stay on the device</text>
  <text x="110" y="80" text-anchor="middle" fill="#8b9bb4" font-size="8" font-family="system-ui,sans-serif">still dies if you type the seed</text>
</svg>
