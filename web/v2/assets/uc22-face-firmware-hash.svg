<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Compare the device fingerprint to the maker website">
  <title>Firmware hash checked</title>
  <rect width="640" height="640" rx="48" fill="#1a2330"/>
  <rect x="72" y="70" width="200" height="280" rx="28" fill="#121820" stroke="#3ecf8e" stroke-width="8"/>
  <rect x="96" y="108" width="152" height="168" rx="12" fill="#0e151c"/>
  <text x="172" y="160" text-anchor="middle" fill="#8b9bb4" font-size="16" font-family="system-ui,sans-serif">device</text>
  <text x="172" y="198" text-anchor="middle" fill="#3ecf8e" font-size="18" font-family="ui-monospace,Menlo,sans-serif">a1b2…9c</text>
  <circle cx="172" cy="312" r="14" fill="none" stroke="#3ecf8e" stroke-width="5"/>
  <rect x="368" y="90" width="200" height="240" rx="16" fill="#121820" stroke="#3d8bfd" stroke-width="8"/>
  <rect x="392" y="118" width="152" height="28" rx="8" fill="#1e2a38"/>
  <text x="468" y="138" text-anchor="middle" fill="#8ec5ff" font-size="14" font-family="system-ui,sans-serif">maker.site</text>
  <text x="468" y="200" text-anchor="middle" fill="#8b9bb4" font-size="16" font-family="system-ui,sans-serif">published</text>
  <text x="468" y="240" text-anchor="middle" fill="#3d8bfd" font-size="18" font-family="ui-monospace,Menlo,sans-serif">a1b2…9c</text>
  <path d="M280 200h80" stroke="#e8eef7" stroke-width="8" stroke-linecap="round"/>
  <text x="320" y="188" text-anchor="middle" fill="#e8eef7" font-size="22" font-family="system-ui,sans-serif">=</text>
  <rect x="120" y="400" width="400" height="88" rx="20" fill="#102018" stroke="#3ecf8e" stroke-width="6"/>
  <text x="320" y="454" text-anchor="middle" fill="#3ecf8e" font-size="28" font-family="system-ui,sans-serif">match → then seed</text>
  <rect x="120" y="508" width="400" height="72" rx="18" fill="#2a1414" stroke="#e85d5d" stroke-width="6"/>
  <text x="320" y="554" text-anchor="middle" fill="#e85d5d" font-size="24" font-family="system-ui,sans-serif">no match → stop</text>
</svg>
