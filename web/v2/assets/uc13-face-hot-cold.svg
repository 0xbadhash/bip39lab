<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hot keys online versus cold keys offline">
  <title>Hot versus cold</title>
  <rect width="640" height="640" rx="48" fill="#1a2330"/>
  <rect x="48" y="80" width="248" height="480" rx="28" fill="#2a1810" stroke="#e8a23c" stroke-width="8"/>
  <rect x="344" y="80" width="248" height="480" rx="28" fill="#102028" stroke="#3d8bfd" stroke-width="8"/>
  <circle cx="172" cy="220" r="64" fill="#e8a23c"/>
  <text x="172" y="230" text-anchor="middle" fill="#1a1400" font-size="32" font-family="system-ui,sans-serif">hot</text>
  <path d="M172 310c40 8 40 72 0 88-40-16-40-80 0-88z" fill="#e85d5d"/>
  <text x="172" y="460" text-anchor="middle" fill="#e8eef7" font-size="22" font-family="system-ui,sans-serif">keys online</text>
  <rect x="400" y="160" width="136" height="168" rx="16" fill="#1a2330" stroke="#8ec5ff" stroke-width="8"/>
  <circle cx="468" cy="216" r="22" fill="none" stroke="#8ec5ff" stroke-width="8"/>
  <rect x="428" y="248" width="80" height="48" rx="8" fill="#3d8bfd"/>
  <text x="468" y="400" text-anchor="middle" fill="#e8eef7" font-size="32" font-family="system-ui,sans-serif">cold</text>
  <text x="468" y="460" text-anchor="middle" fill="#8ec5ff" font-size="22" font-family="system-ui,sans-serif">keys offline</text>
  <text x="320" y="600" text-anchor="middle" fill="#8b9bb4" font-size="20" font-family="system-ui,sans-serif">brand is not the split</text>
</svg>
