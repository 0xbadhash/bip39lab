<svg viewBox="0 0 220 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Changing path does not rewrite the recovery words">
  <title>Words unchanged</title>
  <rect x="8" y="16" width="90" height="44" rx="8" fill="#1a2330" stroke="#3ecf8e" stroke-width="1.5"/>
  <text x="53" y="42" text-anchor="middle" fill="#e8eef7" font-size="10" font-family="system-ui,sans-serif">same words</text>
  <text x="110" y="42" text-anchor="middle" fill="#3d8bfd" font-size="16" font-family="system-ui,sans-serif">=</text>
  <rect x="122" y="16" width="90" height="44" rx="8" fill="#1a2330" stroke="#243044" stroke-width="1.5"/>
  <text x="167" y="36" text-anchor="middle" fill="#e8eef7" font-size="9" font-family="ui-monospace,Menlo,Consolas,monospace">/0/0</text>
  <text x="167" y="50" text-anchor="middle" fill="#8b9bb4" font-size="8" font-family="ui-monospace,Menlo,Consolas,monospace">/0/1</text>
  <text x="110" y="78" text-anchor="middle" fill="#8b9bb4" font-size="8" font-family="system-ui,sans-serif">path changes, phrase does not</text>
</svg>
