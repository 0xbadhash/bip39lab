<svg viewBox="0 0 220 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Daily spend can be hot. Savings stay cold or watch-only">
  <title>Daily versus savings</title>
  <rect x="12" y="14" width="88" height="48" rx="8" fill="#1a2330" stroke="#e85d5d"/>
  <text x="56" y="42" text-anchor="middle" fill="#e8eef7" font-size="9" font-family="system-ui,sans-serif">daily spend</text>
  <rect x="120" y="14" width="88" height="48" rx="8" fill="#1a2330" stroke="#3d8bfd"/>
  <text x="164" y="36" text-anchor="middle" fill="#e8eef7" font-size="9" font-family="system-ui,sans-serif">savings</text>
  <text x="164" y="50" text-anchor="middle" fill="#8b9bb4" font-size="8" font-family="system-ui,sans-serif">cold / watch</text>
  <text x="110" y="78" text-anchor="middle" fill="#8b9bb4" font-size="8" font-family="system-ui,sans-serif">two jobs, two setups</text>
</svg>
