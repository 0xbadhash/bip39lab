<svg viewBox="0 0 220 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A custodial app is an IOU not a BIP-39 wallet">
  <title>Not a BIP-39 wallet</title>
  <rect x="8" y="16" width="90" height="44" rx="8" fill="#1a2330" stroke="#e85d5d"/>
  <text x="53" y="42" text-anchor="middle" fill="#e8eef7" font-size="9" font-family="system-ui,sans-serif">IOU / app</text>
  <text x="110" y="42" text-anchor="middle" fill="#e85d5d" font-size="14" font-weight="700" font-family="system-ui,sans-serif">≠</text>
  <rect x="122" y="16" width="90" height="44" rx="8" fill="#1a2330" stroke="#3d8bfd"/>
  <text x="167" y="42" text-anchor="middle" fill="#e8eef7" font-size="9" font-family="system-ui,sans-serif">your seed</text>
  <text x="110" y="78" text-anchor="middle" fill="#8b9bb4" font-size="8" font-family="system-ui,sans-serif">custodial is not BIP-39</text>
</svg>
