<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Any two of three whole keys can spend">
  <title>2-of-3</title>
  <rect width="640" height="640" rx="48" fill="#1a2330"/>
  <circle cx="160" cy="200" r="70" fill="#121820" stroke="#3ecf8e" stroke-width="8"/>
  <text x="160" y="210" text-anchor="middle" fill="#e8eef7" font-size="28" font-family="system-ui,sans-serif">A</text>
  <circle cx="320" cy="200" r="70" fill="#121820" stroke="#3ecf8e" stroke-width="8"/>
  <text x="320" y="210" text-anchor="middle" fill="#e8eef7" font-size="28" font-family="system-ui,sans-serif">B</text>
  <circle cx="480" cy="200" r="70" fill="#121820" stroke="#8b9bb4" stroke-width="8" stroke-dasharray="10 8"/>
  <text x="480" y="210" text-anchor="middle" fill="#8b9bb4" font-size="28" font-family="system-ui,sans-serif">C</text>
  <path d="M160 280v40M320 280v40" stroke="#3ecf8e" stroke-width="8"/>
  <rect x="120" y="330" width="400" height="90" rx="18" fill="#102018" stroke="#3ecf8e" stroke-width="7"/>
  <text x="320" y="385" text-anchor="middle" fill="#3ecf8e" font-size="26" font-family="system-ui,sans-serif">any 2 spend</text>
  <text x="320" y="480" text-anchor="middle" fill="#e8eef7" font-size="22" font-family="system-ui,sans-serif">three whole keys</text>
  <text x="320" y="530" text-anchor="middle" fill="#8b9bb4" font-size="20" font-family="system-ui,sans-serif">not scraps of one phrase</text>
  <text x="320" y="578" text-anchor="middle" fill="#8b9bb4" font-size="18" font-family="system-ui,sans-serif">this pad does not sign</text>
</svg>
