<svg viewBox="0 0 220 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A forgotten passphrase cannot be reset">
  <title>Forgotten is loss</title>
  <rect x="40" y="12" width="140" height="50" rx="8" fill="#1a2330" stroke="#e85d5d" stroke-width="1.5"/>
  <text x="110" y="34" text-anchor="middle" fill="#e8eef7" font-size="10" font-family="system-ui,sans-serif">passphrase gone</text>
  <text x="110" y="50" text-anchor="middle" fill="#e85d5d" font-size="10" font-family="system-ui,sans-serif">that vault is gone</text>
  <text x="110" y="78" text-anchor="middle" fill="#8b9bb4" font-size="8" font-family="system-ui,sans-serif">lab cannot reset it</text>
</svg>
