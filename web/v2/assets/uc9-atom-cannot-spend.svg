<svg viewBox="0 0 220 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An xpub cannot sign or steal coins">
  <title>Cannot spend</title>
  <rect x="30" y="14" width="160" height="48" rx="8" fill="#1a2330" stroke="#3ecf8e" stroke-width="1.5"/>
  <text x="110" y="36" text-anchor="middle" fill="#e8eef7" font-size="10" font-family="system-ui,sans-serif">no signature</text>
  <text x="110" y="52" text-anchor="middle" fill="#3ecf8e" font-size="10" font-family="system-ui,sans-serif">cannot move coins</text>
  <text x="110" y="78" text-anchor="middle" fill="#8b9bb4" font-size="8" font-family="system-ui,sans-serif">not the twelve words</text>
