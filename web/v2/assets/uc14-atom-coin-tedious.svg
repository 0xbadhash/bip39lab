<svg viewBox="0 0 220 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A coin flip is one bit; 128 flips is the hard path">
  <title>Coin is 1 bit</title>
  <circle cx="48" cy="40" r="22" fill="#1a2330" stroke="#4ea3ff"/>
  <text x="48" y="45" text-anchor="middle" fill="#e8eef7" font-size="14" font-family="system-ui,sans-serif">H/T</text>
  <text x="148" y="38" text-anchor="middle" fill="#e8eef7" font-size="11" font-family="system-ui,sans-serif">1 bit each</text>
  <text x="148" y="56" text-anchor="middle" fill="#8b9bb4" font-size="9" font-family="system-ui,sans-serif">128 flips for 128 bits</text>
</svg>
