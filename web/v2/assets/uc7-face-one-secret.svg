<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One BIP-39 list is the whole secret">
  <title>One secret</title>
  <rect width="640" height="640" rx="48" fill="#1a2330"/>
  <rect x="150" y="72" width="340" height="420" rx="28" fill="#121820" stroke="#3ecf8e" stroke-width="10"/>
  <text x="320" y="150" text-anchor="middle" fill="#3ecf8e" font-size="22" font-family="system-ui,sans-serif">BIP-39</text>
  <g fill="#e8eef7" font-size="20" font-family="ui-monospace,Menlo,sans-serif">
    <text x="210" y="210">1  ·  ·  ·</text>
    <text x="210" y="250">2  ·  ·  ·</text>
    <text x="210" y="290">3  ·  ·  ·</text>
    <text x="390" y="210">10 · · ·</text>
    <text x="390" y="250">11 · · ·</text>
    <text x="390" y="290">12 · · ·</text>
  </g>
  <rect x="220" y="330" width="200" height="72" rx="16" fill="#3ecf8e"/>
  <text x="320" y="376" text-anchor="middle" fill="#102018" font-size="28" font-family="system-ui,sans-serif" font-weight="700">one secret</text>
  <text x="320" y="450" text-anchor="middle" fill="#8b9bb4" font-size="20" font-family="system-ui,sans-serif">not three wallets</text>
  <text x="320" y="560" text-anchor="middle" fill="#8b9bb4" font-size="20" font-family="system-ui,sans-serif">cut into pieces next</text>
  <path d="M290 500h60" stroke="#8b9bb4" stroke-width="6" stroke-linecap="round"/>
  <path d="M338 488l18 12-18 12" fill="#8b9bb4"/>
</svg>
