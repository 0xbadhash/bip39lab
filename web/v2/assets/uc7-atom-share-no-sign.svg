<svg viewBox="0 0 220 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A share cannot sign a bitcoin spend">
  <title>Share cannot sign</title>
  <rect x="30" y="14" width="70" height="44" rx="8" fill="#1a2330" stroke="#243044"/>
  <text x="65" y="40" text-anchor="middle" fill="#e8eef7" font-size="9" font-family="system-ui,sans-serif">share</text>
  <text x="110" y="40" text-anchor="middle" fill="#e85d5d" font-size="16" font-family="system-ui,sans-serif">≠</text>
  <rect x="120" y="14" width="70" height="44" rx="8" fill="#1a2330" stroke="#3d8bfd"/>
  <text x="155" y="40" text-anchor="middle" fill="#e8eef7" font-size="9" font-family="system-ui,sans-serif">signature</text>
  <text x="110" y="78" text-anchor="middle" fill="#8b9bb4" font-size="8" font-family="system-ui,sans-serif">combining is recovery, not spend</text>
</svg>
