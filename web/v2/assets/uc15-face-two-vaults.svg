<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Same twelve words, a second door from the extra secret">
  <title>Two vaults one card</title>
  <rect width="640" height="640" rx="48" fill="#1a2330"/>
  <rect x="70" y="90" width="220" height="300" rx="24" fill="#121820" stroke="#3ecf8e" stroke-width="8"/>
  <rect x="350" y="90" width="220" height="300" rx="24" fill="#121820" stroke="#e8a23c" stroke-width="8"/>
  <circle cx="180" cy="210" r="36" fill="none" stroke="#3ecf8e" stroke-width="10"/>
  <rect x="150" y="248" width="60" height="48" rx="8" fill="#3ecf8e"/>
  <circle cx="460" cy="210" r="36" fill="none" stroke="#e8a23c" stroke-width="10"/>
  <rect x="430" y="248" width="60" height="48" rx="8" fill="#e8a23c"/>
  <path d="M478 188l28-36" stroke="#e8a23c" stroke-width="10" stroke-linecap="round"/>
  <text x="180" y="360" text-anchor="middle" fill="#e8eef7" font-size="22" font-family="system-ui,sans-serif">words only</text>
  <text x="460" y="360" text-anchor="middle" fill="#e8eef7" font-size="22" font-family="system-ui,sans-serif">words + extra</text>
  <rect x="120" y="430" width="400" height="120" rx="20" fill="#121820" stroke="#8b9bb4" stroke-width="6"/>
  <text x="320" y="482" text-anchor="middle" fill="#e8eef7" font-size="24" font-family="system-ui,sans-serif">same 12-word card</text>
  <text x="320" y="520" text-anchor="middle" fill="#8b9bb4" font-size="20" font-family="system-ui,sans-serif">two doors, not a PIN</text>
</svg>
