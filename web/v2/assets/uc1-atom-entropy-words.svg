<svg viewBox="0 0 220 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Random bits become numbered recovery words">
  <title>Entropy to words</title>
  <rect x="8" y="28" width="70" height="22" rx="6" fill="none" stroke="#243044" stroke-width="1.5"/>
  <g fill="#3d8bfd">
    <rect x="12" y="32" width="5" height="14" rx="1"/><rect x="19" y="32" width="5" height="14" rx="1" opacity=".35"/>
    <rect x="26" y="32" width="5" height="14" rx="1"/><rect x="33" y="32" width="5" height="14" rx="1"/>
    <rect x="40" y="32" width="5" height="14" rx="1" opacity=".35"/><rect x="47" y="32" width="5" height="14" rx="1"/>
    <rect x="54" y="32" width="5" height="14" rx="1"/><rect x="61" y="32" width="5" height="14" rx="1" opacity=".35"/>
  </g>
  <text x="43" y="64" text-anchor="middle" fill="#8b9bb4" font-size="9" font-family="system-ui,sans-serif">random bits</text>
  <path d="M86 39h22" stroke="#3d8bfd" stroke-width="1.5" fill="none"/>
  <path d="M104 35l6 4-6 4" fill="#3d8bfd"/>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="8">
    <rect x="116" y="18" width="42" height="16" rx="4" fill="#1a2330" stroke="#243044"/>
    <text x="122" y="29" fill="#8b9bb4">1</text><text x="132" y="29" fill="#e8eef7">word</text>
    <rect x="162" y="18" width="42" height="16" rx="4" fill="#1a2330" stroke="#243044"/>
    <text x="168" y="29" fill="#8b9bb4">2</text><text x="178" y="29" fill="#e8eef7">word</text>
    <rect x="116" y="40" width="42" height="16" rx="4" fill="#1a2330" stroke="#243044"/>
    <text x="122" y="51" fill="#8b9bb4">3</text><text x="132" y="51" fill="#e8eef7">word</text>
    <rect x="162" y="40" width="42" height="16" rx="4" fill="#1a2330" stroke="#243044"/>
    <text x="168" y="51" fill="#8b9bb4">…</text><text x="180" y="51" fill="#e8eef7">N</text>
  </g>
  <text x="160" y="72" text-anchor="middle" fill="#8b9bb4" font-size="9" font-family="system-ui,sans-serif">recovery phrase</text>
</svg>
