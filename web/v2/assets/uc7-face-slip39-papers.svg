  <text x="320" y="200" text-anchor="middle" fill="#e8eef7" font-size="16" font-family="ui-monospace,Menlo,sans-serif">fawn</text>
  <text x="320" y="232" text-anchor="middle" fill="#8b9bb4" font-size="16" font-family="ui-monospace,Menlo,sans-serif">· · ·</text>
