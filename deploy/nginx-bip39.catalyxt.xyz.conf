# Static BIP39 lab — bip39.catalyxt.xyz
# Pattern: same edge as card.catalyxt.xyz (TLS, headers, probe deny) but static root.
# Lab/Multisig: CSP connect-src 'none'. Network page: mempool.space only (Option C).

server {
    server_name bip39.catalyxt.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Security headers are set per-location only (nginx does not clear server-level
    # add_header when a location also sets add_header — multiple CSP headers AND together
    # and would block Network page mempool.space fetches).
    limit_conn catalyxt_conn 40;

    include /etc/nginx/snippets/catalyxt-probe-deny.conf;

    root /home/debian/bip39lab/web;
    index index.html;

    # Option C — same-origin proxy (avoids browser third-party blocks).
    # mempool.space AAAA is often blackholed from this VPS — resolve IPv4 only.
    # Variable proxy_pass + resolver ipv6=off forces A records.
    # Allowlisted Esplora GETs only (no open reverse proxy).
    location ~ ^/api/mempool/(v1/fees/recommended|blocks/tip/height|mempool|tx/[0-9a-fA-F]{64}|address/[1-9A-HJ-NP-Za-km-z]{26,90})$ {
        limit_req zone=catalyxt_req burst=20 nodelay;
        limit_except GET HEAD OPTIONS { deny all; }

        resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;
        resolver_timeout 5s;
        set $mempool_upstream https://mempool.space;
        rewrite ^/api/mempool/(.*)$ /api/$1 break;
        proxy_pass $mempool_upstream;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name mempool.space;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host mempool.space;
        proxy_set_header Accept "application/json,*/*";
        proxy_set_header User-Agent "bip39lab-network-proxy/1.0";
        proxy_set_header Connection "";
        proxy_pass_request_body off;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Security-Policy;
        proxy_connect_timeout 2s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
        proxy_buffering on;
        add_header Cache-Control "public, max-age=10" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/mempool/ {
        return 404;
    }

    # Option C page: allow same-origin proxy + direct mempool.space fallback
    location = /network.html {
        limit_req zone=catalyxt_req burst=40 nodelay;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://mempool.space; base-uri 'none'; form-action 'none'" always;
        try_files $uri =404;
    }

    # V2 tracks: same as Network for UC8/UC10 mempool lookup. Classic / stays connect-src none.
    location ^~ /v2/ {
        limit_req zone=catalyxt_req burst=40 nodelay;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://mempool.space; base-uri 'none'; form-action 'none'" always;
        try_files $uri $uri/ /v2/index.html =404;
    }

    location / {
        limit_req zone=catalyxt_req burst=40 nodelay;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'" always;
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/bip39.catalyxt.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bip39.catalyxt.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = bip39.catalyxt.xyz) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name bip39.catalyxt.xyz;
    return 404;
}
