# Static BIP39 lab — bip39.catalyxt.xyz
# Pattern: same edge as card.catalyxt.xyz (TLS, headers, probe deny) but static root.
# Lab/Multisig: CSP connect-src 'none'. Network page: mempool.space only (Option C).

server {
    server_name bip39.catalyxt.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Security headers are set per-location only (nginx does not clear server-level
    # add_header when a location also sets add_header — multiple CSP headers AND together
    # and would block Network page mempool.space fetches).
    limit_conn catalyxt_conn 40;

    include /etc/nginx/snippets/catalyxt-probe-deny.conf;

    root /home/debian/bip39lab/web;
    index index.html;

    # Option C — public fees/balances only; document CSP must allow mempool.space
    location = /network.html {
        limit_req zone=catalyxt_req burst=40 nodelay;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://mempool.space; base-uri 'none'; form-action 'none'" always;
        try_files $uri =404;
    }

    location / {
        limit_req zone=catalyxt_req burst=40 nodelay;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'" always;
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/bip39.catalyxt.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bip39.catalyxt.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = bip39.catalyxt.xyz) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name bip39.catalyxt.xyz;
    return 404;
}
