<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent-harness ship flow overview</title>
  <desc id="desc">Phases, ship skills, hard gates, and overnight ops lane</desc>
  <defs>
    <style>
      .title { font: 700 20px sans-serif; fill: #111; }
      .label { font: 600 13px sans-serif; fill: #111; }
      .small { font: 11px sans-serif; fill: #333; }
      .muted { font: 11px sans-serif; fill: #555; }
      .phase { fill: #e8f1ff; stroke: #1a56db; stroke-width: 2; }
      .skill { fill: #f3f4f6; stroke: #4b5563; stroke-width: 1.5; }
      .hard { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
      .soft { fill: #fef9c3; stroke: #a16207; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .ops { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .arrow { stroke: #111; stroke-width: 1.6; fill: none; marker-end: url(#m); }
      .arrow-soft { stroke: #6b7280; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#111"/>
    </marker>
  </defs>

  <rect width="1100" height="720" fill="#fafafa"/>
  <text x="40" y="36" class="title">agent-harness — ship flow overview (phases · skills · hard gates · ops)</text>
  <text x="40" y="56" class="muted">Source of truth detail: docs/ship-flow-detailed.md · Editable: ship-flow-overview.drawio</text>

  <!-- Phases -->
  <text x="40" y="90" class="label">PHASES (pipeline.json — hard)</text>
  <rect class="phase" x="40" y="100" width="100" height="40" rx="6"/>
  <text x="70" y="125" class="small">init</text>
  <rect class="phase" x="180" y="100" width="140" height="40" rx="6"/>
  <text x="195" y="125" class="small">ready_for_review</text>
  <rect class="phase" x="360" y="100" width="100" height="40" rx="6"/>
  <text x="380" y="125" class="small">approved</text>
  <rect class="hard" x="500" y="100" width="100" height="40" rx="6"/>
  <text x="525" y="125" class="small">blocked</text>
  <rect class="phase" x="640" y="100" width="100" height="40" rx="6"/>
  <text x="665" y="125" class="small">shipped</text>

  <path class="arrow" d="M140 120 H175"/>
  <path class="arrow" d="M320 120 H355"/>
  <path class="arrow" d="M460 120 H495"/>
  <path class="arrow" d="M550 140 V170 H230 V145"/>
  <path class="arrow" d="M460 120 Q480 80 640 100"/>
  <path class="arrow" d="M740 120 H780 V200 H90 V140"/>

  <text x="145" y="95" class="muted">execute_dev</text>
  <text x="330" y="95" class="muted">pr_review ≥95</text>
  <text x="480" y="95" class="muted">&lt;95</text>
  <text x="580" y="175" class="muted">remediate</text>
  <text x="560" y="85" class="muted">release_mgmt</text>
  <text x="760" y="175" class="muted">sync_docs → init</text>

