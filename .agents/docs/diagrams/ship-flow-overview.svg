  <text x="40" y="220" class="label">SHIP SKILLS (NEXT_SKILL — follow next_skill.py)</text>
  <rect class="skill" x="40" y="235" width="90" height="36" rx="4"/><text x="60" y="257" class="small">/spec</text>
  <rect class="skill" x="145" y="235" width="100" height="36" rx="4"/><text x="155" y="257" class="small">/execute_dev</text>
  <rect class="skill" x="260" y="235" width="100" height="36" rx="4"/><text x="270" y="257" class="small">/code_review</text>
  <rect class="soft" x="375" y="235" width="100" height="36" rx="4"/><text x="385" y="257" class="small">/cross_review</text>
  <rect class="soft" x="490" y="235" width="110" height="36" rx="4"/><text x="500" y="257" class="small">/behavior_val</text>
  <rect class="hard" x="615" y="235" width="100" height="36" rx="4"/><text x="630" y="257" class="small">/pr_review</text>
  <rect class="soft" x="730" y="235" width="90" height="36" rx="4"/><text x="745" y="257" class="small">/vps_infra</text>
  <rect class="skill" x="835" y="235" width="100" height="36" rx="4"/><text x="845" y="257" class="small">/release_mgmt</text>
  <rect class="skill" x="950" y="235" width="90" height="36" rx="4"/><text x="965" y="257" class="small">/sync_docs</text>

  <path class="arrow" d="M130 253 H142"/>
  <path class="arrow" d="M245 253 H257"/>
  <path class="arrow-soft" d="M360 253 H372"/>
  <path class="arrow-soft" d="M475 253 H487"/>
  <path class="arrow" d="M600 253 H612"/>
  <path class="arrow-soft" d="M715 253 H727"/>
  <path class="arrow" d="M820 253 H832"/>
  <path class="arrow" d="M935 253 H947"/>

  <text x="40" y="295" class="muted">Solid = typical path · Dashed yellow = conditional (large / runtime / infra) · Red = hard score gate</text>

  <!-- TDD -->
  <text x="40" y="330" class="label">TDD in /execute_dev (code ships)</text>
  <rect class="skill" x="40" y="345" width="80" height="32" rx="4"/><text x="60" y="365" class="small">Red</text>
  <rect class="skill" x="140" y="345" width="80" height="32" rx="4"/><text x="155" y="365" class="small">Green</text>
  <rect class="skill" x="240" y="345" width="90" height="32" rx="4"/><text x="250" y="365" class="small">Refactor</text>
  <rect class="hard" x="350" y="345" width="160" height="32" rx="4"/><text x="365" y="365" class="small">Red-proof in PR_DRAFT</text>
  <path class="arrow" d="M120 361 H137"/>
  <path class="arrow" d="M220 361 H237"/>
  <path class="arrow" d="M330 361 H347"/>

  <!-- Hard gates box -->
  <text x="40" y="415" class="label">HARD GATES at /pr_review (hard_gates.py — all or nothing)</text>
  <rect class="hard" x="40" y="430" width="1020" height="90" rx="8"/>
  <text x="55" y="455" class="small">Always: Spec | Spec waiver · Secrets on diff</text>
  <text x="55" y="475" class="small">Non-prose: CODE-REVIEW · Red-proof · Traceability · Evidence pack</text>
  <text x="55" y="495" class="small">Runtime: BEHAVIOR-REPORT · Threat notes (≥2 bullets)</text>
  <text x="55" y="512" class="muted">+ pr_validator rubric (score ≥ 95) · release: product_smoke</text>

  <!-- Ops lane -->
  <text x="40" y="555" class="label">OPS LANE (off-phase — does not advance ship FSM)</text>
  <rect class="ops" x="40" y="570" width="140" height="40" rx="6"/><text x="60" y="595" class="small">night_shift</text>
  <rect class="ops" x="210" y="570" width="120" height="40" rx="6"/><text x="230" y="595" class="small">autofix×1</text>
  <rect class="ops" x="360" y="570" width="140" height="40" rx="6"/><text x="375" y="595" class="small">morning_triage</text>
  <rect class="ops" x="530" y="570" width="150" height="40" rx="6"/><text x="545" y="595" class="small">fail_remediate</text>
  <rect class="ops" x="710" y="570" width="160" height="40" rx="6"/><text x="725" y="595" class="small">NIGHT_FAIL_TICKETS</text>
  <path class="arrow" d="M180 590 H207"/>
  <path class="arrow" d="M330 590 H357"/>
  <path class="arrow" d="M500 590 H527"/>
  <path class="arrow" d="M680 590 H707"/>

  <text x="40" y="645" class="label">Post-release (harness SoT)</text>
  <rect class="ops" x="40" y="655" width="220" height="36" rx="6"/><text x="55" y="677" class="small">portfolio_install --install --push</text>
  <rect class="soft" x="280" y="655" width="160" height="36" rx="6"/><text x="300" y="677" class="small">finish_ship / PUSH_PROOF</text>
  <rect class="soft" x="460" y="655" width="140" height="36" rx="6"/><text x="485" y="677" class="small">remaining_board</text>
  <rect class="soft" x="620" y="655" width="140" height="36" rx="6"/><text x="645" y="677" class="small">/qa_campaign</text>
  <text x="780" y="677" class="muted">large only</text>

  <text x="40" y="710" class="muted">Legend: blue=phase · gray=skill · red=hard gate · yellow dashed=soft/conditional · green=ops · LLM must print NEXT_SKILL= after each ship skill</text>
</svg>
