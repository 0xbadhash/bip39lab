# Product plugin — bip39lab (secure offline BIP39 / entropy lab)
# Harness does not assume a language; stack is declared here.

product_id: bip39lab
product_name: bip39lab (offline BIP-39 / entropy lab)
repo_root: .

stack:
  languages: [python, typescript]
  package_manager: pip
  test_runners: [pytest, playwright]
  app_layout: "src/ · web/ static lab"

product_roadmap: ROADMAP.md
harness_backlog: .agents/BACKLOG.md

# Executed at release / smoke (argv arrays; cwd relative to product root).
smoke:
  - name: unit
    cmd: ["python", "-m", "pytest", "-q"]
    cwd: .
  - name: e2e
    cmd: ["npm", "run", "test:e2e"]
    cwd: .

# Deterministic Playwright + Comet scenario contract (harness 1.4.17+)
web_e2e:
  enabled: true
  auto_detect: true
  base_url: https://bip39.catalyxt.xyz
  comet_doc: docs/E2E_COMET_SCENARIOS.md
  playwright_config: playwright.config.ts
  e2e_dir: e2e
  # Exhaustive S0–S55 + human process flows: docs/E2E_COMET_SCENARIOS.md · npm run test:e2e
  surfaces:
    - id: lab
      order: 0
      path: /
      title: BIP39 Lab
      playwright: e2e/lab.spec.ts
      scenarios:
        - { id: smoke, name: "S0–S0c shell", steps: ["6 nav", "theme", "keyboard ?"] }
        - { id: derive, name: "S1–S11 derive", steps: ["generate", "abandon goldens", "passphrase", "path", "testnet", "copy", "QR", "watch-only", "clear", "invalid"] }
        - { id: tools, name: "S14–S23 tools", steps: ["path", "entropy", "compare auto-gen", "descriptors", "PSBT", "explain"] }
        - { id: panels, name: "S24–S25 panels", steps: ["#balance→Network CLI", "glossary threat"] }
        - { id: nav, name: "S10 nav tour", steps: ["all 6 destinations incl Shamir"] }
        - { id: handoff, name: "S15–S16 seed QR Network", steps: ["seed QR", "session bridge"] }
    - id: multisig
      order: 1
      path: /multisig.html
      title: Multisig
      playwright: e2e/multisig.spec.ts
      scenarios:
        - { id: shell, name: "S26 shell", steps: ["CSP offline", "checklist"] }
        - { id: golden, name: "S12 golden refuse", steps: ["2-of-2 P2SH", "no WIF"] }
        - { id: demo, name: "S12b–S27 demo", steps: ["N=3", "24 words"] }
        - { id: bip67, name: "S28–S30 bip67 clear copy", steps: ["BIP67 off", "clear", "copy"] }
        - { id: nav, name: "S31 nav", steps: ["to Lab/Network"] }
    - id: shamir
      order: 2
      path: /shamir.html
      title: Shamir
      playwright: e2e/shamir.spec.ts
      scenarios:
        - { id: shell, name: "S53 shell", steps: ["CSP offline", "danger banner", "6-nav"] }
        - { id: split, name: "S54 split demo", steps: ["generate", "2-of-3", "3 cards"] }
        - { id: err, name: "S55 empty secret", steps: ["no fake success"] }
    - id: slip39
      order: 3
      path: /slip39.html
      title: SLIP-39 lab
      playwright: e2e/slip39.spec.ts
      scenarios:
        - { id: shell, name: "S57 shell", steps: ["CSP offline", "danger banner", "compare table"] }
        - { id: deep, name: "S57b Shamir link", steps: ["Shamir → slip39.html"] }
        - { id: split, name: "S58 2-of-3", steps: ["generate", "split", "combine match"] }
        - { id: under, name: "S59 under-threshold", steps: ["error no fake secret"] }
        - { id: pp, name: "S60 wrong passphrase", steps: ["mismatch", "group diagram data-group"] }
        - { id: pp_manual, name: "S60b manual wrong pp", steps: ["split correct", "combine wrong", "mismatch"] }
    - id: network
      order: 4
      path: /network.html
      title: Network
      playwright: e2e/network.spec.ts
      scenarios:
        - { id: shell, name: "S32 shell", steps: ["CSP mempool", "ack gate"] }
        - { id: fees, name: "S13b fees", steps: ["bands", "traffic", "UTXO"] }
        - { id: bal, name: "S13c–d balances", steps: ["reject seed", "fetch", "bridge"] }
        - { id: edge, name: "S33–S35 edge", steps: ["no ack", "empty", "tools link"] }
    - id: v2
      order: 5
      path: /v2/
      title: V2 use-case tracks
      playwright: e2e/v2.spec.ts
      scenarios:
        - { id: picker, name: "V2-S0 picker", steps: ["10 cards", "classic /"] }
        - { id: uc1, name: "V2-S1 generate", steps: ["words first", "validate gated"] }
        - { id: quiz, name: "V2-S2 quiz+exit", steps: ["msg-ok", "force ack"] }
        - { id: deeplink, name: "V2-S3 ?uc=3", steps: ["gate UC3"] }
        - { id: chrome, name: "V2-S4 generate chrome", steps: ["12-24", "clear beside generate"] }
        - { id: compact, name: "V2-S9 compact", steps: ["24-word 3 lines", "entropy", "3 addr"] }
        - { id: pathidx, name: "V2-S10 path index", steps: ["increment", "reset 0"] }
        - { id: uc6, name: "V2-S11 three zpubs", steps: ["cosigners", "rail back"] }
        - { id: quizwhy, name: "V2-S12 quiz why", steps: ["Wrong.", "concept chips"] }
    - id: chrome
      order: 6
      path: /
      title: Site chrome
      playwright: e2e/site-chrome.spec.ts
      scenarios:
        - { id: parity, name: "S36–S40 chrome", steps: ["6-nav labels", "CSP", "aria-current", "branding"] }

vault:
  enabled: false
  root_env: PRODUCT_VAULT_ROOT
  default_root: ""
  project_label: bip39lab
  dev_log_rel: 01-Projects/bip39lab/dev-log.md
  mirror_docs: []

property_tests:
  enabled: true
  modules:
    - bip39lab

product_path_prefixes:
  - src/
  - web/
  - tests/

domain_review_hints:
  - no secret retention (mnemonics, entropy, seeds, xprv, private keys)
  - no logging of seed material
  - offline-first; network only for opt-in address queries
  - no eval/exec of config
  - vendored BIP-39 wordlists with integrity checks
  - audited crypto for production path; hand-rolled ECC is non-default only
  - BIP39 checksum validation required
  - balance failure must not be treated as zero
  - domain correctness vs BIP32/39/44/49/84 fixtures

night_shift:
  default_host: ""
  live_path: ""
  live_urls: []
  live_expect_code: "200"
  coverage_soft: "1"

# Full ship FSM is required for every ROADMAP phase (see ROADMAP.md).
# Agents must start each phase with /spec (or an explicit Spec waiver).
ship_policy:
  full_fsm_per_roadmap_phase: true
  require_spec: true
  allow_spec_waiver_only_for: [hotfix, chore, docs-only, prose-only]

product_skills: []

# J14 — BIP-39 mnemonic parse/validate (crypto messy input)
property_tests:
  enabled: true
  modules:
    - bip39lab/bip39
    - bip39lab/wordlist

smoke_ci:
  - name: hardcodes
    cmd: ["python", "scripts/check_hardcodes.py"]
    cwd: .
  - name: unit-property
    cmd: ["python", "-m", "pytest", "tests/test_property_bip39.py", "tests/test_bip39_vectors.py", "-q", "--tb=line"]
    cwd: .

