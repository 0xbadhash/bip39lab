# Product plugin — bip39lab (secure offline BIP39 / entropy lab)
# Harness does not assume a language; stack is declared here.

product_id: bip39lab
product_name: bip39lab (offline BIP-39 / entropy lab)
repo_root: .

stack:
  languages: [python, typescript]
  package_manager: pip
  test_runners: [pytest, playwright]
  app_layout: "src/ · web/ static lab"

product_roadmap: ROADMAP.md
harness_backlog: .agents/BACKLOG.md

# Executed at release / smoke (argv arrays; cwd relative to product root).
smoke:
  - name: unit
    cmd: ["python", "-m", "pytest", "-q"]
    cwd: .
  - name: e2e
    cmd: ["npm", "run", "test:e2e"]
    cwd: .

# Deterministic Playwright + Comet scenario contract (harness 1.4.17+)
web_e2e:
  enabled: true
  auto_detect: true
  base_url: https://bip39.catalyxt.xyz
  comet_doc: docs/E2E_COMET_SCENARIOS.md
  playwright_config: playwright.config.ts
  e2e_dir: e2e
  surfaces:
    - id: lab
      order: 0
      path: /
      title: BIP39 Lab
      playwright: e2e/lab.spec.ts
      scenarios:
        - id: smoke
          name: Smoke load
          steps: ["Open Lab", "6 nav items", "Generate visible"]
        - id: tools
          name: Tools pack
          steps: ["Tools panel", "path playground", "PSBT/descriptors"]
    - id: multisig
      order: 1
      path: /multisig.html
      title: Multisig
      playwright: e2e/multisig.spec.ts
      scenarios:
        - id: build
          name: Multisig build
          steps: ["Public keys only", "P2SH/P2WSH", "Policy checklist"]
    - id: network
      order: 2
      path: /network.html
      title: Network
      playwright: e2e/network.spec.ts
      scenarios:
        - id: optin
          name: Network opt-in
          steps: ["Ack gate", "Fee snapshot", "Balances fail-closed"]

vault:
  enabled: false
  root_env: PRODUCT_VAULT_ROOT
  default_root: ""
  project_label: bip39lab
  dev_log_rel: 01-Projects/bip39lab/dev-log.md
  mirror_docs: []

product_path_prefixes:
  - src/
  - web/
  - tests/

domain_review_hints:
  - no secret retention (mnemonics, entropy, seeds, xprv, private keys)
  - no logging of seed material
  - offline-first; network only for opt-in address queries
  - no eval/exec of config
  - vendored BIP-39 wordlists with integrity checks
  - audited crypto for production path; hand-rolled ECC is non-default only
  - BIP39 checksum validation required
  - balance failure must not be treated as zero
  - domain correctness vs BIP32/39/44/49/84 fixtures

night_shift:
  default_host: ""
  live_path: ""
  live_urls: []
  live_expect_code: "200"
  coverage_soft: "1"

# Full ship FSM is required for every ROADMAP phase (see ROADMAP.md).
# Agents must start each phase with /spec (or an explicit Spec waiver).
ship_policy:
  full_fsm_per_roadmap_phase: true
  require_spec: true
  allow_spec_waiver_only_for: [hotfix, chore, docs-only, prose-only]

product_skills: []
